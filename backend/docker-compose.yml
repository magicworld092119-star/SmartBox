version: '3.8'

services:
  db:
    image: postgres:15
    container_name: smartbox_db
    restart: always
    environment:
      POSTGRES_USER: smartbox_user
      POSTGRES_PASSWORD: smartbox_password
      POSTGRES_DB: smartbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
